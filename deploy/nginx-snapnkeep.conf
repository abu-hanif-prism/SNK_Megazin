# Snapnkeep Mini v2 — one static UI + one API process. Replaces the legacy
# 3-process layout (SSR:4000 / API:8080 / Puppeteer:3001).
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50M;

    # built Next.js app, static export (guest UI + admin console)
    root /home/snapnkeep/servers/v2/ui;
    index index.html;

    # frames & finished prints — immutable filenames, cache hard
    location ^~ /frames/ {
        alias /home/snapnkeep/servers/v2/server/public/frames/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /prints/ {
        alias /home/snapnkeep/servers/v2/server/public/prints/;
        expires 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # hashed build assets can be cached forever
    location ~* \.(js|css|woff2?|ttf|png|jpe?g|gif|webp|svg|ico)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static export: every route has its own <route>/index.html. Unknown URLs
    # get the exported 404 page, which sends the browser back to "/".
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary on;
}
